
name: Gerar APK ADAILSON TECK TV

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extrair projeto
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: nenhum ZIP encontrado."
            exit 1
          fi
          mkdir -p projeto
          unzip -o "$ZIP_FILE" -d projeto

      - name: Compilar APK
        run: |
          PROJECT_DIR="$(find projeto -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi
          gradle -p "$PROJECT_DIR" --no-daemon assembleDebug
          echo "APK_DIR=$PROJECT_DIR/app/build/outputs/apk/debug" >> "$GITHUB_ENV"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ADAILSON-TECK-TV-APK
          path: ${{ env.APK_DIR }}/*.apk
          if-no-files-found: error
